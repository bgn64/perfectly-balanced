    - Tab moves through sign-in controls.
    - Enter submits the focused sign-in form.
  mouse:
    - Sign-in buttons submit their associated forms.
    - Theme preview buttons switch every startup state together.
fixtures:
  unauthenticated: Clear the local Supabase auth session.
  authenticated: Use the seeded local account from AGENTS.md.
  saved_light: Set perfectly-balanced.theme to light before navigation.
interaction_fidelity: functional
reconciliation:
  source: Running application at http://localhost:5173
  outcome: The saved light fixture renders all four startup states with the dark default palette.
proposal:
  visual_change: Palette only; layout, copy, spacing, and control hierarchy are unchanged.
  implementation:
    - Move theme preference ownership above authentication and configuration branches.
    - Initialize the resolved theme before the first application render.
    - Remove theme-specific fallback colors outside the shared token definitions.
    - Keep chart colors as intentional data visualization colors unless contrast verification fails.
