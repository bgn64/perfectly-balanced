  files:
    - src/terminal.css
    - src/App.css
    - src/theme.css
  outcomes:
    - The authenticated shell fills the browser viewport without an outer border, radius, shadow, width cap, or gutter.
    - Existing desktop and mobile grid regions, internal separators, and workspace scrolling remain unchanged.
verification:
  automated:
