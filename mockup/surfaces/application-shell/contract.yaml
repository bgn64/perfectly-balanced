navigation_followup:
  status: implemented
  approved_at: 2026-09-14
  implemented_at: 2026-09-14
  reconciled_at: 2026-09-14
  preview: focus.html
  interaction_fidelity: simulated
  fixture: Synthetic Cedar Cafe and Local Market rows; no backend writes.
  observations:
    - Live Settings hover leaves DOM focus on the previously focused theme control.
    - Transaction hover, focus-within, and editing selection share a background in current styles.
    - Click and Enter open transaction details; closing restores the recorded opener.
    - Preview dialog uses native dialog containment to simulate the existing transaction focus trap.
  source_audit:
    - Transaction c and t shortcuts fall back to remembered selection outside a focused row.
    - Budget is-selected and aria-current mix temporary focus with editing state.
    - Report dialogs have no Tab trap and lack a fallback when the opener disappears.
  limitations:
    - Preview is a representative interaction specimen, not a reproduction of transaction data or editor layout.
    - Live Settings returned a 401 during observation; backend authorization is outside this change.
  viewports: [1440x900, 390x844]
  themes: [dark, light]
  proposed_states:
    - Keyboard-focused row alongside a separately hovered neighbor.
    - Persistently selected theme alongside keyboard focus on a different control.
    - Nested category action without activating transaction details twice.
    - Text entry and caret retained while hovering other controls.
    - Combobox active descendant changes on hover while input retains DOM focus.
    - Dialog open, trapped Tab focus, Escape close, and opener restoration.
    - Loading, disabled, empty, and error states preserve existing layout and never receive stale row shortcuts.
  rules:
    - Hover adds only a subtle theme-aware tint and never changes DOM focus or row shortcut targets.
    - Keyboard focus has a distinct two-pixel inset outline without layout movement.
    - Selection and editing remain separate from focus; aria-current is not a focus indicator.
    - Click and Enter share activation; nested controls never activate their parent row.
    - Row shortcuts require a focused row context; remembered IDs are only restoration aids.
    - Focus and statusline update together when targets blur, disappear, or open a modal.
    - Combobox hover may change the active descendant but must not steal text-entry focus.
  implementation_plan:
    - Reuse theme tokens and existing semantic navigation attributes; no global hover-to-focus system.
    - Apply shared interaction styles across shell, budgets, transactions, reports, Settings, and authentication controls.
    - Scope transaction shortcuts to actual focused context and preserve click/Enter parity.
    - Separate budget focus, editing, selection, and accessibility attributes.
    - Add report modal containment and safe restoration fallbacks; verify other dialogs and editors.
    - Add focused unit and browser regression coverage for the interaction contract.
  implementation:
    - Shared theme-aware hover tint and two-pixel inset keyboard focus indicator, including selected-theme contrast.
    - Budget focus no longer marks rows or subsections selected or aria-current; editing remains explicit.
    - Transaction and split shortcuts require actual row focus context.
    - Focusout clears stale shell focus tracking; combobox options retain input focus during pointer selection.
    - Report dialogs trap Tab and use a fallback opener; Settings restoration has a navigation fallback.
  verification:
    unit: 48 tests passed, including four focused Tab-containment tests.
    browser: Seven native Chromium tests passed using real local Auth and intercepted read-only financial fixtures.
    commands: npm test, npm run test:browser, npm run lint, npm run build, git diff --check.
    screenshots: Native focus-and-hover desktop and Dark/Light desktop/mobile screenshots inspected under ignored test-results.
    coverage:
      - Hover preserves the keyboard target and typed text.
      - Click and Enter open details and restore the specific opener.
      - Nested category controls do not open transaction details.
      - Row shortcuts do not act from outside the row context.
      - Combobox hover changes the active descendant while input keeps focus.
      - Report Tab and Shift+Tab containment and missing-opener fallback.
      - Blur clears the previous shell target; keyboard focus remains visible in both themes and viewport sizes.
    warnings:
      - Production build retains the existing large-chunk advisory.
      - Browser automation currently targets Chromium; Safari and Firefox are not covered by this suite.
workspace_state_followup:
  status: implemented
  approved_at: 2026-09-14
  implemented_at: 2026-09-14
  reconciled_at: 2026-09-14
  preview: workspace-state.html
  interaction_fidelity: functional
  viewports: [1440x900, 390x844]
  themes: [dark, light]
  fixture: Synthetic transaction controls and report modes; no backend access or writes.
  current_behavior:
    - Active view conditionally mounts exactly one workspace panel.
    - Leaving Transactions destroys committed time range, filters, and sort with the panel.
    - Leaving Reports destroys its All, Planned, or Categorized mode with the panel.
    - Shared selected month already survives navigation because AuthenticatedShell owns it.
    - Open dialogs, draft filters, editors, loading, data, focus, and errors also reset on panel unmount.
  architecture:
    cause: Durable workspace configuration and temporary panel interaction state share the same component-local lifetime.
    constraint: Workspace configuration lasts only for the current authenticated shell and must not use URL, localStorage, or sessionStorage.
  proposal:
    durable_workspace_state:
      - Transaction time range, committed filters, and sort.
      - Report All, Planned, or Categorized mode.
      - Shared selected month, which already has the intended lifetime.
    disposable_panel_state:
      - Open control and detail dialogs.
      - Unapplied filter drafts, search query, pagination, editors, loading, data, focus, and errors.
    behavior:
      - Switching among Budget, Transactions, and Reports preserves each workspace's committed controls.
      - Reloading, signing out, or remounting AuthenticatedShell restores defaults.
      - Navigation does not write URL history, localStorage, or sessionStorage.
      - Inactive panels remain unmounted so hidden queries, dialogs, controls, and keyboard listeners cannot stay active.
    visual_change: None; existing control labels and selected treatments simply retain their committed values after navigation.
    implementation:
      - Define typed default transaction and report view state in pure model modules.
      - Own those view states beside activeView and selectedMonth in AuthenticatedShell.
      - Make TransactionsPanel and InsightsPanel controlled for committed workspace state only.
      - Keep transient panel state local and reset it naturally on unmount.
  implementation:
    files:
      - src/App.tsx
      - src/transactions/viewState.ts
      - src/transactions/viewState.test.ts
      - src/transactions/TransactionsPanel.tsx
      - src/insights/reportModel.ts
      - src/insights/InsightsPanel.tsx
      - tests/navigation.pw.ts
    outcomes:
      - AuthenticatedShell owns transaction time, filters, sort, and report mode for the current authenticated app session.
      - Inactive panels still unmount, preserving disposable lifetimes for drafts, dialogs, search, pagination, data, editors, focus, and errors.
      - Reload and sign-out restore defaults without URL, localStorage, or sessionStorage workspace-state persistence.
    verification:
      - npm test: 54 tests passed.
      - npm run test:browser: 8 native Chromium tests passed.
      - npm run lint: passed.
      - npm run build: passed with the existing large-chunk advisory.
      - git diff --check: passed.
      - Browser workflow preserved transaction controls and report mode across Budget navigation, discarded unapplied filter drafts, and reset on reload and sign-out.
visual_unification_followup:
  status: implemented
  reconciled_at: 2026-09-15
  proposed_at: 2026-09-15
  approved_at: 2026-09-15
  implemented_at: 2026-09-15
  preview: index.html
  source: Running application at http://localhost:5173 plus current component styles and read-only navigation fixtures.
  owners:
    - src/navigation/WorkspaceMonthHeading.tsx
    - src/budgets/BudgetPanel.tsx
    - src/transactions/TransactionsPanel.tsx
    - src/insights/InsightsPanel.tsx
    - src/terminal.css
    - src/theme.css
  viewports: [1440x900, 390x844]
  themes: [dark, light]
  fixtures:
    shell: Seeded September 2026 empty budget.
    rows: Synthetic Dining budget allocation and Cedar Cafe transaction; no backend writes.
  current_behavior:
    - At 1440x900 the authenticated shell bounds are exactly 1440x900 at the viewport origin, with no outer border, radius, margin, or shadow.
    - The canonical shell preview had drifted behind the implementation and still showed the pre-rail month heading.
    - The light canvas, chrome, surface, and raised surface use nearby cool-gray values, producing little visual separation and a muted overall appearance.
    - The month rail renders the view name, slash, and month as separate inline elements with different measured vertical bounds; the month sits about 3.6px lower than the view name.
    - Budget and transaction rows share 0.75rem by 1rem spacing, subtle separators, selection fill, and a two-pixel left selection marker, but duplicate those rules independently.
    - Report transaction rows use 0.7rem vertical spacing and a two-pixel inset outline instead of the left selection marker used by budget and transaction rows.
  baseline_outcome:
    - Canonical preview now matches the current full-bleed shell and month rail.
    - Canonical preview shows current budget, transaction, and report row treatments together in both themes for direct comparison.
  research:
    sources:
      - W3C ARIA APG Date Picker Dialog: previous and next buttons surround one live month/year heading.
      - Adobe React Aria Calendar: previous button, flexible centered CalendarHeading, then next button.
      - IBM Carbon Date Picker: previous and next chevrons sit at the left and right edges of the month header.
      - FullCalendar header toolbar: current period title and navigation are distinct toolbar elements, separate from view identity.
      - MUI, Fluent UI, and React DayPicker retain one month/year caption plus dedicated previous and next controls.
    common_pattern:
      - Keep the page or view name separate from the temporal navigation.
      - Present month and year as one stable label controlled by adjacent icon-only previous and next buttons.
      - Announce the changing period through a polite live region and give both icon buttons explicit accessible names.
    selected_variant:
      - Apply the full-page toolbar variation used by calendar products: current period as the workspace heading with a compact navigation pair aligned at the opposite edge.
      - Let persistent navigation and page content communicate the current view instead of repeating Budget, Transactions, or Reports in the workspace heading.
  proposal:
    light_theme:
      - Use white content surfaces on a near-white workspace with blue-tinted chrome instead of neighboring gray fills.
      - Increase structural separation through cooler subtle borders while retaining Tokyo Night blue, green, red, amber, and violet semantic accents.
      - Keep text and controls at WCAG AA contrast or better in default, hover, selected, and focused states.
    month_heading:
      - Remove the repeated Budget, Transactions, or Reports page title and the explanatory eyebrow and subtitle from the workspace heading.
      - Render the current month and year as the sole h1 and polite live region.
      - Group icon-only previous and next buttons at the far right of the same toolbar, with explicit accessible names and no visible labels.
      - Strengthen the active navigation item with the selection fill, higher-contrast text, bold weight, and an accent rail so the sidebar carries view identity.
    shared_rows:
      - Introduce a shared data-row visual primitive for minimum height, padding, surface, separator, hover, keyboard focus, and persistent selection.
      - Use shared primary-content and amount roles for consistent type hierarchy and alignment.
      - Keep budget, transaction, and report-specific grid templates and nested actions; the shared primitive must not flatten their information architecture.
      - Keyboard focus uses a two-pixel inset outline, hover uses the lighter hover tint, and persistent selection uses the selection fill plus a two-pixel left marker.
  interactions:
    - Existing month navigation, row activation, nested controls, focus containment, and restoration behavior remains unchanged.
    - Theme preview switches the whole canonical surface between unchanged dark tokens and the proposed brighter light tokens.
  responsive:
    - Desktop review at 1440x900 shows the month at the left and the compact arrow pair at the right of one toolbar.
    - Mobile review at 390x844 keeps the month and arrow pair on one row without clipping or overlap.
  implementation:
    files:
      - src/finance/DataRow.tsx
      - src/budgets/BudgetPanel.tsx
      - src/transactions/TransactionsPanel.tsx
      - src/insights/InsightsPanel.tsx
      - src/navigation/WorkspaceMonthHeading.tsx
      - src/navigation/WorkspaceMonthHeading.test.tsx
      - src/terminal.css
      - src/theme.css
      - src/theme.ts
      - src/theme.test.ts
      - tests/navigation.pw.ts
    outcomes:
      - The current month is the sole workspace h1; previous and next icon buttons align to the far right with unchanged semantic navigation behavior.
      - The active sidebar item carries view identity through a theme-aware selection fill, stronger text, and a desktop left rail or mobile bottom rail.
      - Light mode uses white content surfaces, a near-white workspace, blue-tinted chrome, and higher-separation borders while preserving semantic accent colors.
      - Budget, transaction, and report drill-down rows use one ref-safe DataRow component and shared geometry, separator, hover, focus, and selection styles.
      - Transaction status pills render below the shared month toolbar so all three workspace views retain identical header geometry.
  verification:
    - npm test: 69 tests passed.
    - npm run test:browser: 11 Chromium tests passed, including the new cross-surface data-row geometry and focus contract.
    - npm run lint: passed.
    - npm run build: passed with the existing large-chunk advisory.
    - git diff --check: passed before the implementation record update.
    - Live app checked at 1440x900 and 390x844 in Light and Dark with no horizontal overflow or month/action overlap.
    - Live report drill-down verified the shared DataRow class, 56px minimum height, 0.7rem vertical padding, and subtle bottom separator.