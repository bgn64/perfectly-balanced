reconciliation:
  source: Running application at http://localhost:5173
  measurements:
    - At 1440x900 the shell is 1392x852 with a 24px perimeter, 10.4px radius, 1px border, and outer shadow.
    - At 1920x1080 the 1536px width cap leaves 192px of canvas on each side.
    - At 390x844 the border and radius disappear, but the authenticated shell retains a 24px vertical margin.
  controlling_styles:
    - src/terminal.css defines the inset window width, height, margin, border, radius, clipping, and shadow.
    - src/App.css repeats height and margin on a more specific authenticated-shell selector.
  outcome: Authenticated application chrome is presented as a rounded desktop window inside the browser canvas.
proposal:
  visual_change:
    - Make the authenticated shell exactly fill the browser viewport at every supported width.
    - Remove the shell's outer border, rounded corners, shadow, width cap, and decorative canvas gutter.
    - Preserve titlebar, sidebar, workspace, statusline, panel borders, spacing, and content hierarchy.
  geometry:
    - Shell bounds equal viewport bounds at 1920x1080, 1440x900, and 390x844.
    - Titlebar stays pinned to the top and statusline stays pinned to the bottom through the existing grid.
    - Workspace remains the only independently scrolling region.
  rationale: Internal separators already provide the application structure; the outer window treatment duplicates the browser boundary and reduces usable workspace.
