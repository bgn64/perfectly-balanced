name: Deploy to Production

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out the deployment revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000

      - name: Determine Supabase deployment changes
        id: supabase_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "functions=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" HEAD -- supabase/migrations; then
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BASE_SHA" HEAD -- supabase/functions supabase/config.toml; then
            echo "functions=false" >> "$GITHUB_OUTPUT"
          else
            echo "functions=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI
        if: steps.supabase_changes.outputs.migrations == 'true' || steps.supabase_changes.outputs.functions == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Pull Vercel production configuration
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build the application
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Link Supabase production project
        if: steps.supabase_changes.outputs.migrations == 'true' || steps.supabase_changes.outputs.functions == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply Supabase migrations
        if: steps.supabase_changes.outputs.migrations == 'true'
        run: supabase db push

      - name: Deploy Supabase Edge Functions
        if: steps.supabase_changes.outputs.functions == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy the prebuilt output
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
