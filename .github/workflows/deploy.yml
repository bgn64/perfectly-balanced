name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter deploy after the database cutover and reconciliation are complete"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'deploy'
    runs-on: ubuntu-latest
    environment: Production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BUDGET_SCHEMA_READY: ${{ vars.BUDGET_SCHEMA_READY }}
    steps:
      - name: Require completed database cutover
        run: |
          if [ "$BUDGET_SCHEMA_READY" != "true" ]; then
            echo "::error::Production is gated until the new database schema and imported data are verified."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint

      - name: Pull Vercel production configuration
        run: npx --yes vercel@62.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build and type-check
        run: npx --yes vercel@62.2.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy the verified build
        run: npx --yes vercel@62.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
