name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Compose template without deployment secrets
        run: docker compose -f compose.yaml.example config --quiet
        env:
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-template-validation-only-not-a-runtime-secret
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hosting
      - run: npm run test:e2e
      - run: docker build --tag perfectly-balanced:validation .
